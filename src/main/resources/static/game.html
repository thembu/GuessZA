<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GuessZA — Round</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:#000;overflow:hidden;height:100vh;}

        #streetview{position:fixed;inset:0;width:100%;height:100%;z-index:0;}

        .topbar{
            position:fixed;top:0;left:0;right:0;
            display:flex;align-items:center;justify-content:space-between;
            padding:12px 20px;
            background:linear-gradient(to bottom,rgba(0,0,0,0.6),transparent);
            z-index:10;
        }
        .logo{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#fff;letter-spacing:1px;}
        .logo span{color:#009B77;}
        .round-badge{
            background:rgba(0,0,0,0.55);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:20px;
            padding:6px 16px;
            font-size:13px;
            color:rgba(255,255,255,0.7);
        }
        .round-badge strong{color:#fff;}

        .map-panel{
            position:fixed;
            bottom:24px;right:24px;
            z-index:20;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 8px 32px rgba(0,0,0,0.7);
            width:200px;
            height:150px;
            transition:width 0.3s ease, height 0.3s ease, box-shadow 0.3s ease;
            display:flex;
            flex-direction:column;
        }
        .map-panel:hover{
            width:400px;
            height:300px;
            box-shadow:0 12px 48px rgba(0,0,0,0.9);
        }
        .map-panel:hover #map{ height: calc(300px - 52px); }

        #map{
            width:100%;
            height:calc(150px - 52px);
            flex:1;
            transition:height 0.3s ease;
            cursor:crosshair;
        }

        .map-footer{
            background:#1a1a1a;
            border-top:2px solid #009B77;
            display:flex;
            align-items:center;
            justify-content:flex-end;
            padding:10px 12px;
            height:52px;
            flex-shrink:0;
        }
        .guess-btn{
            background:#009B77;
            color:#fff;
            font-family:'DM Sans',sans-serif;
            font-size:13px;
            font-weight:500;
            padding:8px 18px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            transition:background 0.2s,opacity 0.2s;
            white-space:nowrap;
        }
        .guess-btn:hover{background:#007a5e;}
        .guess-btn:disabled{opacity:0.35;cursor:not-allowed;}

        .map-hint{
            position:absolute;
            top:40%;left:50%;transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.65);
            color:rgba(255,255,255,0.65);
            font-size:11px;
            padding:5px 12px;
            border-radius:20px;
            pointer-events:none;
            white-space:nowrap;
            transition:opacity 0.3s;
            z-index:5;
        }
        .map-wrap{position:relative;flex:1;min-height:0;}
    </style>
</head>
<body>

<div id="streetview"></div>

<div class="topbar">
    <div class="logo">Guess<span>ZA</span></div>
    <div class="round-badge">Round <strong id="roundNum">1</strong> of 5</div>
    <div style="width:80px;"></div>
</div>

<div class="map-panel" id="mapPanel">
    <div class="map-wrap">
        <div id="map"></div>
        <div class="map-hint" id="mapHint">Hover to expand · click to pin</div>
    </div>
    <div class="map-footer">
        <button class="guess-btn" id="guessBtn" disabled onclick="submitGuess()">Submit Guess</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const API = 'http://localhost:8080';
    let map, marker, currentRoundId, currentRoundNum;
    let guessLat = null, guessLng = null;

    function initMap() {
        map = L.map('map', {zoomControl:false, attributionControl:false}).setView([-28.5, 24.5], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© CartoDB'
        }).addTo(map);
        // invalidate size when panel expands/shrinks
        document.getElementById('mapPanel').addEventListener('mouseenter', () => {
            setTimeout(() => map.invalidateSize(), 310);
        });
        document.getElementById('mapPanel').addEventListener('mouseleave', () => {
            setTimeout(() => map.invalidateSize(), 310);
        });

        map.on('click', function(e) {
            guessLat = e.latlng.lat;
            guessLng = e.latlng.lng;
            if(marker) marker.remove();
            marker = L.marker([guessLat, guessLng]).addTo(map);
            document.getElementById('guessBtn').disabled = false;
            document.getElementById('mapHint').style.opacity = '0';
        });
    }

    function initStreetView(lat, lng) {
        const sv = new google.maps.StreetViewService();
        sv.getPanorama({location:{lat,lng}, radius:500}, (data, status) => {
            if(status === 'OK') {
                new google.maps.StreetViewPanorama(document.getElementById('streetview'), {
                    position: data.location.latLng,
                    addressControl: false,
                    showRoadLabels: false,
                    fullscreenControl: false,
                    motionTracking: false,
                });
            }
        });
    }

    async function loadRound() {
        const gameId = localStorage.getItem('gameId');
        // TODO: GET /api/games/{gameId}/current-round
        // set currentRoundId, currentRoundNum
        // call initStreetView(lat, lng)
        // update round badge
    }

    async function submitGuess() {
        if(guessLat === null) return;
        document.getElementById('guessBtn').disabled = true;
        // TODO: POST /api/rounds/{currentRoundId}/guess with guessLat/guessLng
        // save result to localStorage
        // navigate to result.html
    }

    initMap();
    loadRound();
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script>
</body>
</html>
