<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GuessZA — Who are you?</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'DM Sans',sans-serif;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#0d0d0d;
        }
        .card{
            background:#161616;
            border:1px solid rgba(255,255,255,0.08);
            border-radius:20px;
            padding:52px 48px;
            width:90%;
            max-width:400px;
            text-align:center;
        }
        .back{
            display:inline-block;
            color:rgba(255,255,255,0.3);
            font-size:13px;
            text-decoration:none;
            margin-bottom:32px;
            transition:color 0.2s;
        }
        .back:hover{color:rgba(255,255,255,0.6);}
        h2{
            font-family:'Bebas Neue',sans-serif;
            font-size:36px;
            color:#fff;
            letter-spacing:1px;
            margin-bottom:8px;
        }
        .sub{
            color:rgba(255,255,255,0.4);
            font-size:14px;
            margin-bottom:32px;
        }
        input{
            width:100%;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.12);
            border-radius:10px;
            padding:14px 16px;
            color:#fff;
            font-family:'DM Sans',sans-serif;
            font-size:16px;
            outline:none;
            transition:border 0.2s;
            margin-bottom:16px;
        }
        input::placeholder{color:rgba(255,255,255,0.25);}
        input:focus{border-color:#009B77;}
        .hint{
            font-size:12px;
            color:rgba(255,255,255,0.25);
            margin-bottom:28px;
            text-align:left;
        }
        button{
            width:100%;
            background:#009B77;
            color:#fff;
            font-family:'DM Sans',sans-serif;
            font-size:15px;
            font-weight:500;
            padding:15px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            transition:background 0.2s,opacity 0.2s;
        }
        button:hover{background:#007a5e;}
        button:disabled{opacity:0.4;cursor:not-allowed;}
        .error{
            color:#e05252;
            font-size:13px;
            margin-top:12px;
            display:none;
        }
    </style>
</head>
<body>
<div class="card">
    <a href="index.html" class="back">← Back</a>
    <h2>What's your name?</h2>
    <p class="sub">Pick a nickname to get started</p>
    <input id="nickname" type="text" placeholder="e.g. Sipho, Thabo, Amahle" maxlength="20" autocomplete="off"/>
    <p class="hint">3–20 characters · letters, numbers, underscores only</p>
    <button id="startBtn" onclick="startGame()">Start Playing</button>
    <p class="error" id="errorMsg"></p>
</div>
<script>
    const API = 'http://localhost:8080';

    document.getElementById('nickname').addEventListener('keydown', e => {
        if(e.key === 'Enter') startGame();
    });

    async function startGame() {
        const nickname = document.getElementById('nickname').value.trim();
        const btn = document.getElementById('startBtn');
        const err = document.getElementById('errorMsg');

        if(!nickname || nickname.length < 3) {
            err.textContent = 'Nickname must be at least 3 characters.';
            err.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Loading...';
        err.style.display = 'none';

        try {
            // TODO: POST /api/users, save userId, POST /api/games, save gameId, navigate to game.html
        } catch(e) {
            err.textContent = 'Something went wrong. Is the server running?';
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Start Playing';
        }
    }
</script>
</body>
</html>
