<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GuessZA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:#0f1613;color:#fff;height:100vh;overflow:hidden;position:relative;}
  /* ============================================================
     HERO IMAGE — replace url() below.
     Recommended: wide SA landscape (Cape Town, Drakensberg, Karoo, Kruger).
     File location: src/main/resources/static/images/hero.jpg
     Resolution: 1920x1080+, landscape.
     ============================================================ */
  .bg{
    position:fixed;inset:0;
    background:#0f1613 url('images/hero.jpg') center/cover no-repeat; /* IMAGE HERE */
    z-index:0;
  }
  .bg::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg, rgba(15,22,19,0.92) 0%, rgba(15,22,19,0.5) 60%, rgba(15,22,19,0.3) 100%);
  }
  .topnav{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:24px 40px;}
  .brand{font-weight:700;font-size:18px;letter-spacing:-0.3px;}
  .brand span{color:#4ade80;}
  .nav-links{display:flex;gap:28px;font-size:13px;color:rgba(255,255,255,0.6);}
  .container{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:0 40px;display:flex;align-items:center;height:calc(100vh - 80px);}
  .content{max-width:560px;}
  h1{font-size:72px;font-weight:800;letter-spacing:-2.5px;line-height:1;margin-bottom:24px;}
  .subtitle{font-size:17px;color:rgba(255,255,255,0.75);line-height:1.6;max-width:460px;margin-bottom:36px;}
  .btn-primary{background:#4ade80;color:#0a2818;border:none;padding:16px 36px;font-family:inherit;font-size:15px;font-weight:600;border-radius:8px;cursor:pointer;transition:background 0.15s,transform 0.1s;}
  .btn-primary:hover{background:#3ec972;transform:translateY(-1px);}
</style>
</head>
<body>
<div class="bg"></div>
<div class="topnav">
  <div class="brand">Guess<span>ZA</span></div>
  <div class="nav-links"><span>How to play</span></div>
</div>
<div class="container">
  <div class="content">
    <h1>Where in South Africa?</h1>
    <p class="subtitle">Explore a random street view. Drop your pin. Score up to 5,000 points per round based on how close you get.</p>
    <button class="btn-primary" onclick="navigate()">Play</button>
  </div>
</div>
<script>
  const API = 'http://localhost:8080';
  async function navigate(){
    const userId = localStorage.getItem('userId');
    if(!userId){ window.location.href = 'nickname.html'; return; }
    try{
      const res = await fetch(`${API}/api/users/${userId}`);
      if(res.status === 200){ window.location.href = 'mode.html'; }
      else{ window.location.href = 'nickname.html'; }
    }catch(e){ window.location.href = 'nickname.html'; }
  }
</script>
</body>
</html>
