<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GuessZA</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'DM Sans',sans-serif;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#0a0a0a;
            overflow:hidden;
        }
        .bg{
            position:fixed;inset:0;
            background:url('https://images.unsplash.com/photo-1580060839134-75a5edca2e99?w=1600&q=80') center/cover no-repeat;
            filter:brightness(0.35);
            z-index:0;
        }
        .card{
            position:relative;z-index:1;
            background:rgba(10,10,10,0.75);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:20px;
            padding:56px 52px;
            text-align:center;
            max-width:420px;
            width:90%;
            backdrop-filter:blur(12px);
        }
        .flag{font-size:48px;margin-bottom:20px;}
        h1{
            font-family:'Bebas Neue',sans-serif;
            font-size:52px;
            color:#fff;
            letter-spacing:2px;
            line-height:1;
            margin-bottom:12px;
        }
        h1 span{color:#009B77;}
        p{
            color:rgba(255,255,255,0.55);
            font-size:15px;
            line-height:1.6;
            margin-bottom:36px;
        }
        .play-btn{
            display:inline-block;
            background:#009B77;
            color:#fff;
            font-family:'DM Sans',sans-serif;
            font-size:16px;
            font-weight:500;
            padding:16px 48px;
            border-radius:50px;
            text-decoration:none;
            letter-spacing:0.5px;
            transition:background 0.2s,transform 0.15s;
        }
        .play-btn:hover{background:#007a5e;transform:scale(1.03);}
        .tagline{
            margin-top:28px;
            font-size:12px;
            color:rgba(255,255,255,0.25);
            letter-spacing:1px;
            text-transform:uppercase;
        }
    </style>
</head>
<body>
<div class="bg"></div>
<div class="card">
    <div class="flag">🇿🇦</div>
    <h1>Guess<span>ZA</span></h1>
    <p>You've been dropped somewhere in South Africa.<br/>Look around and guess where you are.</p>
    <a href="nickname.html" class="play-btn">Play</a>
    <p class="tagline">5 rounds · no time limit</p>
</div>
</body>
</html>
