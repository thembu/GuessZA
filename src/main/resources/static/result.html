<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GuessZA — Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:#0d0d0d;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
        .topbar{
            display:flex;align-items:center;justify-content:space-between;
            padding:12px 20px;
            background:rgba(0,0,0,0.6);
            border-bottom:1px solid rgba(255,255,255,0.07);
            flex-shrink:0;
        }
        .logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:1px;}
        .logo span{color:#009B77;}
        .content{display:flex;flex:1;min-height:0;}
        #map{flex:1;}
        .sidebar{
            width:300px;
            flex-shrink:0;
            background:#161616;
            border-left:1px solid rgba(255,255,255,0.08);
            display:flex;
            flex-direction:column;
            padding:28px 24px;
            gap:20px;
        }
        .location-name{
            font-family:'Bebas Neue',sans-serif;
            font-size:28px;
            color:#fff;
            letter-spacing:1px;
            line-height:1.1;
        }
        .location-sub{font-size:13px;color:rgba(255,255,255,0.4);margin-top:4px;}
        .divider{height:1px;background:rgba(255,255,255,0.08);}
        .stat{display:flex;flex-direction:column;gap:4px;}
        .stat-label{font-size:11px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;}
        .stat-value{font-size:32px;font-family:'Bebas Neue',sans-serif;letter-spacing:1px;}
        .stat-value.green{color:#009B77;}
        .stat-value.amber{color:#e8a020;}
        .next-btn{
            margin-top:auto;
            background:#009B77;
            color:#fff;
            font-family:'DM Sans',sans-serif;
            font-size:15px;
            font-weight:500;
            padding:14px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            transition:background 0.2s;
            text-align:center;
            width:100%;
        }
        .next-btn:hover{background:#007a5e;}
    </style>
</head>
<body>
<div class="topbar">
    <div class="logo">Guess<span>ZA</span></div>
    <div style="font-size:13px;color:rgba(255,255,255,0.4);">Round <span id="roundNum">—</span> result</div>
    <div style="width:80px;"></div>
</div>
<div class="content">
    <div id="map"></div>
    <div class="sidebar">
        <div>
            <div class="location-name" id="locationName">—</div>
            <div class="location-sub" id="locationSub">—</div>
        </div>
        <div class="divider"></div>
        <div class="stat">
            <span class="stat-label">Distance off</span>
            <span class="stat-value amber" id="distance">—</span>
        </div>
        <div class="stat">
            <span class="stat-label">Score</span>
            <span class="stat-value green" id="score">—</span>
        </div>
        <div class="divider"></div>
        <button class="next-btn" onclick="nextRound()" id="nextBtn">Next Round →</button>
    </div>
</div>

<script>
    function formatDistance(metres) {
        if(metres >= 1000) return (metres / 1000).toFixed(1) + ' km';
        return metres + ' m';
    }

    function initMap() {
        const result   = JSON.parse(localStorage.getItem('lastResult') || '{}');
        const guessLat = parseFloat(localStorage.getItem('guessLat'));
        const guessLng = parseFloat(localStorage.getItem('guessLng'));
        const roundNum = localStorage.getItem('currentRoundNum') || '?';

        document.getElementById('roundNum').textContent      = roundNum;
        document.getElementById('locationName').textContent  = result.locationName || '—';
        document.getElementById('locationSub').textContent   = (result.locationCity || '') + ' · ' + (result.locationProvince || '');
        document.getElementById('distance').textContent      = formatDistance(result.distanceMeters || 0);
        document.getElementById('score').textContent         = (result.score || 0).toLocaleString();

        const actualPos = {lat: result.locationLatitude, lng: result.locationLongitude};
        const guessPos  = {lat: guessLat, lng: guessLng};

        const map = new google.maps.Map(document.getElementById('map'), {
            zoom: 5,
            center: actualPos,
            disableDefaultUI: true,
            zoomControl: true,
            mapTypeId: 'roadmap'
        });

        // Actual location — green marker
        new google.maps.Marker({
            position: actualPos,
            map,
            title: 'Actual location',
            icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 10,
                fillColor: '#009B77',
                fillOpacity: 1,
                strokeColor: '#fff',
                strokeWeight: 2
            }
        });

        // Guess — red marker
        new google.maps.Marker({
            position: guessPos,
            map,
            title: 'Your guess',
            icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 10,
                fillColor: '#e05252',
                fillOpacity: 1,
                strokeColor: '#fff',
                strokeWeight: 2
            }
        });

        // Line between them
        new google.maps.Polyline({
            path: [actualPos, guessPos],
            map,
            strokeColor: '#ffffff',
            strokeOpacity: 0.4,
            strokeWeight: 2,
            icons: [{
                icon: {path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3},
                offset: '0',
                repeat: '12px'
            }]
        });

        // Fit both markers in view
        const bounds = new google.maps.LatLngBounds();
        bounds.extend(actualPos);
        bounds.extend(guessPos);
        map.fitBounds(bounds, {top:40, right:40, bottom:40, left:40});

        // Update next button label if game over
        if(localStorage.getItem('gameOver') === 'true') {
            document.getElementById('nextBtn').textContent = 'See Final Score →';
        }
    }

    function nextRound() {
        const gameOver = localStorage.getItem('gameOver') === 'true';
        window.location.href = gameOver ? 'end.html' : 'game.html';
    }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAupnVFwh_d1dbKI9WPDZFJOsL2kltLQgA&callback=initMap" async defer></script>
</body>
</html>
