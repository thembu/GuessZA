<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GuessZA — Game Over</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'DM Sans',sans-serif;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#0d0d0d;
        }
        .card{
            background:#161616;
            border:1px solid rgba(255,255,255,0.08);
            border-radius:20px;
            padding:52px 48px;
            width:90%;
            max-width:420px;
            text-align:center;
        }
        .flag{font-size:48px;margin-bottom:20px;}
        h2{
            font-family:'Bebas Neue',sans-serif;
            font-size:36px;
            color:#fff;
            letter-spacing:1px;
            margin-bottom:8px;
        }
        .sub{color:rgba(255,255,255,0.4);font-size:14px;margin-bottom:36px;}
        .score-box{
            background:rgba(0,155,119,0.1);
            border:1px solid rgba(0,155,119,0.3);
            border-radius:14px;
            padding:28px;
            margin-bottom:12px;
        }
        .score-label{font-size:12px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
        .score-value{
            font-family:'Bebas Neue',sans-serif;
            font-size:64px;
            color:#009B77;
            letter-spacing:2px;
            line-height:1;
        }
        .score-max{font-size:13px;color:rgba(255,255,255,0.25);margin-top:6px;}
        .high-score{
            font-size:13px;
            color:rgba(255,255,255,0.35);
            margin-bottom:32px;
        }
        .high-score span{color:#e8a020;}
        .play-btn{
            display:block;
            width:100%;
            background:#009B77;
            color:#fff;
            font-family:'DM Sans',sans-serif;
            font-size:15px;
            font-weight:500;
            padding:15px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            transition:background 0.2s;
            margin-bottom:12px;
        }
        .play-btn:hover{background:#007a5e;}
        .home-link{
            font-size:13px;
            color:rgba(255,255,255,0.3);
            text-decoration:none;
            transition:color 0.2s;
        }
        .home-link:hover{color:rgba(255,255,255,0.6);}
    </style>
</head>
<body>
<div class="card">
    <div class="flag">🏁</div>
    <h2>Game Over</h2>
    <p class="sub">Here's how you did, <span id="nickname">player</span></p>
    <div class="score-box">
        <div class="score-label">Total Score</div>
        <div class="score-value" id="totalScore">0</div>
        <div class="score-max">out of 25,000</div>
    </div>
    <p class="high-score">Your best: <span id="highScore">—</span></p>
    <button class="play-btn" onclick="playAgain()">Play Again</button>
    <a href="index.html" class="home-link">Back to home</a>
</div>
<script>
    const API = 'http://localhost:8080';


    let visited_locations = [];
    try {
        const stored = JSON.parse(localStorage.getItem('visitedLocations'));
        if (Array.isArray(stored)) visited_locations = stored;
    } catch(e) {}

    async function loadEndScreen() {
        new Audio('/sound-pointcount.mp3').play();
        const totalScore = localStorage.getItem('totalScore') || '0';
        const nickname = localStorage.getItem('nickname') || 'player';
        const userId = localStorage.getItem('userId');

        document.getElementById('totalScore').textContent = parseInt(totalScore).toLocaleString();
        document.getElementById('nickname').textContent = nickname;

        if(userId) {
            try {
                const res = await fetch(`${API}/api/users/${userId}`);
                const user = await res.json();
                document.getElementById('highScore').textContent = (user.highScore || 0).toLocaleString();
            } catch(e) {}
        }
    }

    async function playAgain() {
        const userId = localStorage.getItem('userId');
        if(!userId) { window.location.href = 'index.html'; return; }
        try {
            const res = await fetch(`${API}/api/games`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId , visitedLocations: visited_locations})
            });
            const game = await res.json();
            localStorage.setItem('gameId', game.id);
            window.location.href = 'game.html';
        } catch(e) {
            window.location.href = 'index.html';
        }
    }

    loadEndScreen();
</script>
</body>
</html>
