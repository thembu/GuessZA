services:
  postgres:
    image: postgres:16
    container_name: guessza-db
    environment:
      POSTGRES_DB: guessza
      POSTGRES_USER: guess
      POSTGRES_PASSWORD: pass

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "guess", "-d", "guessza"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - guessza_data:/var/lib/postgresql/data
      # init.sql removed — Flyway now owns the schema and seed data.
      # Spring Boot runs migrations automatically on startup via
      # src/main/resources/db/migration/V1__init_schema.sql and V2__seed_locations.sql.
  guessza:
    build:
      dockerfile: Dockerfile

    image: guessza:latest
    container_name: guessza

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/guessza

    ports:
      - 8080:8080

    depends_on:
      postgres:
        condition: service_healthy


    restart: unless-stopped

volumes:
  guessza_data: