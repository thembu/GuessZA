services:
  postgres:
    image: postgres:16
    container_name: guessza-db
    environment:
      POSTGRES_DB: guessza
      POSTGRES_USER: guess
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - guessza_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  guessza_data: