services:
  postgres:
    image: postgres:16
    container_name: guessza-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - guessza_data:/var/lib/postgresql/data
      # init.sql removed — Flyway now owns the schema and seed data.
      # Spring Boot runs migrations automatically on startup via
      # src/main/resources/db/migration/V1__init_schema.sql and V2__seed_locations.sql.
  guessza:
    build:
      dockerfile: Dockerfile

    image: guessza:latest
    container_name: guessza

    environment:
      SPRING_DATASOURCE_URL:  jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}



    ports:
      - 8080:8080

    depends_on:
      postgres:
        condition: service_healthy


    restart: unless-stopped

volumes:
  guessza_data: